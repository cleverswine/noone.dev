<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Terminal output from the Spotify CLI authorization flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  <rect x="90" y="140" width="1020" height="620" rx="16" fill="#0b0f19" fill-opacity="0.78"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#f8fafc">
    <text x="130" y="200" fill="#fbbf24">$ spotify-cli</text>
    <text x="130" y="250">--- to continue, please log in and authorize at</text>
    <text x="130" y="284">the following url ---</text>
    <text x="130" y="330" fill="#fdba74">https://accounts.spotify.com/authorize?client_id=</text>
    <text x="130" y="364" fill="#fdba74">...&amp;redirect_uri=http://localhost:8080/callback</text>
    <text x="130" y="430">AUTH_DEBUG:: waiting for callback on port :8080</text>
    <text x="130" y="470">AUTH_DEBUG:: callback url hit</text>
    <text x="130" y="510">AUTH_DEBUG:: verifying code from callback</text>
    <text x="130" y="550">AUTH_DEBUG:: code verified, exchanging for token</text>
    <text x="130" y="590" fill="#86efac">AUTH_DEBUG:: success</text>
  </g>
</svg>
