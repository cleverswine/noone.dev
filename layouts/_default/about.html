{{ define "main" }}
<article class="max-w-2xl">
    <div class="flex items-center gap-5">
        {{ with .Resources.GetMatch "profile.*" }}
        <img src="{{ .RelPermalink }}" alt="Photo of {{ $.Site.Params.author }}"
            class="h-20 w-20 shrink-0 rounded-full object-cover ring-1 ring-slate-900/10 dark:ring-white/10">
        {{ end }}
        <h2 class="font-mono text-xl font-semibold text-slate-900 dark:text-white">{{ .Title }}</h2>
    </div>
    <div class="prose prose-slate mt-6 max-w-none dark:prose-invert prose-headings:font-mono prose-a:text-teal-600 dark:prose-a:text-teal-400">
        {{ .Content }}
    </div>
</article>
{{ end }}
