{{ define "main" }}
<article class="mx-auto max-w-2xl">
    {{ $image := "" }}
    {{ with .Resources.GetMatch "cover.*" }}{{ $image = .RelPermalink }}{{ end }}
    {{ with $image }}
    <img src="{{ . }}" alt="" class="mb-6 aspect-video w-full rounded-xl object-cover">
    {{ end }}
    <h2 class="mb-1 text-xl font-bold text-slate-900 dark:text-white">{{ .Title }}</h2>
    {{ if not .Date.IsZero }}
    <time class="text-xs text-slate-500 dark:text-slate-500">{{ .Date.Format (.Site.Params.dateFormat | default "January 2, 2006") }}</time>
    {{ end }}
    <div class="prose prose-slate mt-6 max-w-none dark:prose-invert prose-a:text-teal-600 dark:prose-a:text-teal-400 prose-code:before:content-none prose-code:after:content-none">
        {{ .Content }}
    </div>
</article>
{{ end }}
